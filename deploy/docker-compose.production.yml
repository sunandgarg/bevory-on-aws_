services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: bevory-api:latest
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVE_FRONTEND: "false"
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001/api/health',{headers:{'x-bevory-origin-verify':process.env.ORIGIN_VERIFY_SECRET}}).then(r=>{if(!r.ok)process.exit(1)})"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
